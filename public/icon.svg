<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>
    <linearGradient id="needleOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="needleCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="104" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="100" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.25" />

  <!-- Concentric Gyro / Factor Graph Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#0ea5e9" stroke-width="2.5" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="80" fill="none" stroke="#f97316" stroke-width="2" stroke-opacity="0.3" />

  <!-- Navigation Reticle Crosshairs -->
  <line x1="256" y1="56" x2="256" y2="106" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  <line x1="256" y1="406" x2="256" y2="456" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
  <line x1="56" y1="256" x2="106" y2="256" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
  <line x1="406" y1="256" x2="456" y2="256" stroke="#64748b" stroke-width="4" stroke-linecap="round" />

  <!-- North Heading Needle (Orange) -->
  <polygon points="256,90 286,256 256,236" fill="url(#needleOrange)" />
  <polygon points="256,90 226,256 256,236" fill="#f97316" />

  <!-- South Trajectory Needle (Cyan) -->
  <polygon points="256,422 286,256 256,276" fill="url(#needleCyan)" />
  <polygon points="256,422 226,256 256,276" fill="#0284c7" />

  <!-- Center Inertial Core -->
  <circle cx="256" cy="256" r="22" fill="#0f172a" stroke="#f8fafc" stroke-width="4" />
  <circle cx="256" cy="256" r="8" fill="#38bdf8" />

  <!-- GNSS Satellite Orbit Node -->
  <circle cx="390" cy="150" r="14" fill="#38bdf8" />
  <circle cx="390" cy="150" r="24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5" />
</svg>
